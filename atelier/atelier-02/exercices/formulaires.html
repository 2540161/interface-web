<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices sur les formulaires</title>
</head>
<body>
    <h1>Exercices sur les formulaires HTML</h1>

    <!-- Exercice 11: Formulaire d'inscription avec méthode POST -->
    <section>
        <h2>Formulaire d'inscription</h2>
        <form action="../resultats/inscription.html" method="post">
            <label for="nom">Nom complet</label>
            <input id="nom" type="text" name="nom" required>
            <br>
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>
            <br>
            <label for="password">Mot de passe</label>
            <input id="password" type="password" name="password" minlength="8" required>
            <br>
            <button type="submit">S'inscrire</button>
        </form>
    </section>

    <!-- Exercice 12: Formulaire de contact avec méthode GET -->
    <section>
        <h2>Formulaire de contact</h2>
        <form action="../resultats/contact.html" method="get">
            <label for="sujet">Sujet</label>
            <br>
            <input type="text" name="sujet" id="sujet" required>
            <br>
            <label for="message">Votre message</label>
            <br>
            <textarea name="message" id="message" rows="4" cols="50" placeholder="Votre message"></textarea>
            <br>
            <label for="priorite">Priorité</label>
            <br>
            <select name="priorite" id="priorite">
                <option value="Basse">Basse</option>
                <option value="Moyenne">Moyenne</option>
                <option value="Haute">Haute</option>
            </select>
            <br>
            <button type="submit">Envoyer</button>
        </form>
    </section>

    <!-- Exercice 13: Formulaire avec validation -->
    <section>
        <h2>Formulaire de commande</h2>
        <form action="">
            <label for="quantite">Quantité</label>
            <br>
            <input type="number" name="quantite" id="quantite" min="1" max="10" value="1">
            <br>
            <label for="livraison">Date de livraison</label>
            <br>
            <input type="date" name="livraison" id="livraison" required>
            <br>
            <label for="telephone">Téléphone</label>
            <br>
            <input type="tel" name="telephone" id="telephone">
        </form>
    </section>

    <!-- Navigation -->
    <nav>
        <!-- À COMPLÉTER: Liens de navigation relatifs -->
    </nav>
</body>
</html>
